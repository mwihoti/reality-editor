<!doctype html>
<meta charset="utf-8">
<title>bot</title>
<style>canvas { width: 960px; height: 540px; display: block; }</style>
<canvas id="game"></canvas>
<pre id="out"></pre>
<script type="module">
// A play bot: it drives each scene with the real input path (keys for movement
// and rewinding, releasedRect for drag-cuts, exactly like a human release) and
// the scene only counts as passed when the game itself reports cleared/won.
//
// Policy, evaluated every frame:
//   riding the lift   -> stand until it tops out, then step off
//   crates ahead      -> drag a cut over them (studio only)
//   gate in the way   -> rewind until it swings clear
//   relay door ahead  -> rewind until the plate is held, then run through it
//   blocked, high door-> rewind the lift down
//   no floor ahead    -> hold R for the dolly
//   blocked, hoist    -> park the load, then cut the wheel
//   otherwise         -> walk right
import { LEVELS } from '../src/levels.js';
import { createGame } from '../src/game.js';

const DT = 1 / 120;
const MAX_SECONDS = 320;

const cv = document.getElementById('game');
cv.width = 1920;
cv.height = 1080;
const g = createGame(cv, LEVELS);
g.resize();

const toScreen = (r) => {
  const z = g.cam.zoom || 1;
  return {
    x: (r.x - g.cam.x - 960) * z + 960,
    y: (r.y - 540) * z + 540,
    w: r.w * z,
    h: r.h * z
  };
};

function union(rects) {
  const x = Math.min(...rects.map(r => r.x)) - 24;
  const y = Math.min(...rects.map(r => r.y)) - 24;
  const x2 = Math.max(...rects.map(r => r.x + r.w)) + 24;
  const y2 = Math.max(...rects.map(r => r.y + r.h)) + 24;
  return { x, y, w: x2 - x, h: y2 - y };
}

function solve(index) {
  g.startRun(index);
  const W = g.world;
  const P = g.player;
  const keys = g.input.keys;

  const lift = W.byId('lift');
  const gate = W.level.props.find(p => p.kind === 'gate');
  const relay = W.level.props.find(p => p.kind === 'relay');
  const highExit = (W.level.exit.doorY ?? 820) < 700;

  let frames = 0;
  let lastX = P.x;
  let still = 0;
  let cuts = 0;
  let cutCool = 0;
  let jumpCool = 0;
  let pullExtra = 0;
  let felled = false;
  let dollyX = null;
  let liftY = null;
  let sawLowLift = false;
  const trace = [];
  const note = (what) => { if (trace.length < 10) trace.push(`${what}@${P.x.toFixed(0)}`); };
  const maxFrames = Math.round(MAX_SECONDS / DT);

  while (g.state === 'playing' && frames < maxFrames) {
    keys.clear();

    const dolly = W.byId('dolly');
    const dollyS = dolly ? W.stateAt(dolly, W.time) : null;
    dollyX = dollyS ? dollyS.x : null;
    const liftS = lift ? W.stateAt(lift, W.time) : null;
    liftY = liftS ? liftS.y : null;
    const gateS = gate ? W.stateAt(gate, W.time) : null;
    const onLift = P.groundId === 'lift';
    const onDolly = P.groundId === 'dolly';

    const solids = W.solids(P.groundId);
    const probeY = P.y + P.h + 12;
    const over = (s, x) => x >= s.x && x <= s.x + s.w && probeY >= s.y - 6 && probeY <= s.y + s.h;
    // moving props are collision ghosts while rewinding, so probe them directly
    const floorAhead = [8, 20, 32].some(dx => {
      const x = P.x + P.w + dx;
      return solids.some(s => over(s, x))
        || (dollyS ? over(dollyS, x) : false)
        || (liftS ? over(liftS, x) : false);
    });

    const crates = W.cuttableProps().filter(p =>
      p.kind === 'crate'
      && p.x + p.w > P.x + P.w - 6
      && p.x < P.x + P.w + 360
      && p.y + p.h > P.y - 30
      && p.y < P.y + P.h + 30);

    // the bar blocks only while it is low and close enough to walk into
    const gateBlocks = !!gateS
      && gateS.y + gateS.h > P.y + 8
      && gateS.y < P.y + P.h
      && gateS.x + gateS.w > P.x + P.w - 12
      && gateS.x < P.x + P.w + 90;

    const relayAhead = !!relay && relay.x > P.x && relay.x - P.x < 480;
    const liftUp = !!liftS && liftS.y < lift.motion.to + 40;
    const nearLift = !!lift && Math.abs((lift.x + lift.w / 2) - (P.x + P.w / 2)) < 560;
    const dollyGap = dollyS ? dollyS.x - (P.x + P.w) : Infinity;

    let cut = null;

    if (onLift) {
      if (liftS.y > lift.motion.to + 6) { /* wait for the ride */ }
      else keys.add('KeyD');
    } else if (onDolly) {
      // stand still and let it carry you, then step off at the far end
      if (dolly.motion && dollyS.x >= dolly.motion.to - 26) keys.add('KeyD');
    } else if (still > 0.2 && crates.length && W.cutsLeft() > 0 && cutCool <= 0) {
      cut = union(crates.map(p => W.stateAt(p, W.time)));
      cutCool = 0.5;
    } else if (gateBlocks) {
      // The bar lifts on its own every cycle, so standing is the reliable
      // answer. Scrubbing here used to fight the cycle: rewind into the same
      // blocked frames, step forward, repeat — twelve seconds and 4 tape at
      // the finale's gate without the player moving an inch.
    } else if (relayAhead) {
      if (!W.plateHeld()) {
        pullExtra = 0;
        if (W.tape > 0.02) keys.add('KeyR');
      } else if (pullExtra < 2.0) {
        // the pad only holds for a while: pull deep inside the window first
        pullExtra += DT;
        if (W.tape > 0.02) keys.add('KeyR');
      } else {
        keys.add('KeyD');
      }
    } else if (!floorAhead) {
      const parked = dollyS && dollyS.x <= dolly.motion.from + 2;
      if (lift && nearLift) {
        // a lift is the way over: stand still, its next dwell is seconds away.
        // (This is the finale's gap: reaching for the dolly here burned the
        // whole tape pulling back a dolly that is only dead weight on a pad.)
      } else if (dolly && parked && dollyGap > 4 && dollyGap <= 200 && still > 0.15) {
        keys.add('KeyD');
        if (P.onGround && jumpCool <= 0) { keys.add('Space'); jumpCool = 0.5; }
      } else if (dolly && !lift && W.tape > 0.02) {
        keys.add('KeyR');                     // pull the dolly back to the ledge
      }
      // a lift: just stand still, its next dwell is only seconds away
    } else if (still > 0.35 && W.hasMechanism() && !W.exitOpen()) {
      const pad = Math.abs(W.loadCX() - W.level.sensorCX);
      if (!W.driveRunning()) keys.add('KeyR');            // frozen off the pad: undo it
      else if (pad < 30) cut = union([W.stateAt(W.byId('wheel'), W.time)]);
      else if (W.tape > 0.02) keys.add('KeyR');
    } else {
      keys.add('KeyD');
    }

    if (cut) {
      g.input.releasedRect = toScreen(cut);
      cuts++;
    }

    g.step(DT);
    frames++;
    cutCool = Math.max(0, cutCool - DT);
    jumpCool = Math.max(0, jumpCool - DT);

    if (Math.abs(P.x - lastX) < 0.4) still += DT;
    else still = 0;
    if (P.groundId === 'lift') note('ride');
    if (liftY !== null && liftY > 812) sawLowLift = true;
    if (P.x < lastX - 100) note('respawn');
    if (!felled && P.y > 900) { felled = true; note('fell'); }
    if (felled && P.y < 780) felled = false;
    lastX = P.x;
  }

  return {
    state: g.state,
    label: g.world.level.label,
    seconds: frames * DT,
    x: P.x,
    y: P.y,
    on: P.groundId,
    tape: W.tape,
    blades: W.cutsLeft(),
    cuts,
    time: W.time,
    door: W.exitOpen(),
    driving: W.driveRunning(),
    load: W.loadCX(),
    plate: W.plateHeld(),
    dolly: dollyX,
    liftY,
    sawLowLift,
    still,
    trace
  };
}

const out = [];
const results = [];
let failed = 0;

for (let i = 0; i < LEVELS.length; i++) {
  const r = solve(i);
  const pass = r.state === 'cleared' || r.state === 'won';
  if (!pass) failed++;
  results.push(r);
  out.push(
    `${pass ? 'ok  ' : 'FAIL'} scene ${String(i + 1).padStart(2, '0')} ${r.label}` +
    ` — ${r.state} in ${r.seconds.toFixed(1)}s, x=${r.x.toFixed(0)},` +
    ` tape=${r.tape.toFixed(1)}, blades=${r.blades}, cuts=${r.cuts}` +
    (pass ? '' : `, y=${r.y.toFixed(0)}, on=${r.on}, t=${r.time.toFixed(1)},` +
      ` door=${r.door}, driving=${r.driving}, load=${r.load}, plate=${r.plate},` +
      ` dolly=${r.dolly}, liftY=${r.liftY}, lowSeen=${r.sawLowLift}, still=${r.still.toFixed(2)}`) +
    (pass || !r.trace.length ? '' : `\n       trace: ${r.trace.join(' ')}`)
  );
}

out.push('');
out.push(failed === 0
  ? `BOT PASS all ${LEVELS.length} scenes completed`
  : `BOT FAIL ${failed} of ${LEVELS.length} scenes could not be completed`);
document.getElementById('out').textContent = out.join('\n');
document.title = failed === 0 ? `BOT PASS ${LEVELS.length}/${LEVELS.length}` : `BOT FAIL ${failed}`;
</script>
