<!doctype html>
<meta charset="utf-8">
<title>stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100vw; height: 100vh; display: block; }
</style>
<canvas id="game"></canvas>
<script type="module">
// Deterministic scene set-up for screenshots: ?scene=<name>&level=<index>
import { LEVELS } from '../src/levels.js';
import { createGame } from '../src/game.js';

const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'title';
const lv = Number(q.get('level') || 0);

// ?save=1 seeds local progress so the continue button and the best-run row
// can be photographed
if (q.get('save')) {
  const { writeSave } = await import('../src/save.js');
  writeSave({ unlocked: 4, cleared: [0, 1, 2, 3], best: { time: 214 }, finished: false });
}

const g = createGame(document.getElementById('game'), LEVELS);
g.resize();

const W = g.world;
const wheelRect = { x: 2680, y: 520, w: 170, h: 170 };
const wallRect = { x: 840, y: 400, w: 340, h: 440 };
const settle = (n = 6) => { for (let i = 0; i < n; i++) g.step(1 / 120); };

function go() {
  if (scene === 'title') {
    g.game.state = 'title';
    return;
  }

  g.startRun(lv);

  if (scene === 'level') {
    const at = Number(q.get('x') || 0);
    g.player.place(at || g.level.spawn.x + 240, 726);
    settle();
    g.cam.x = Math.max(0, g.player.x - 760);
    return;
  }

  if (scene === 'cleared') {
    g.game.state = 'cleared';
    g.game.stats = { time: 47, blades: 3, tape: 21.4 };
    g.player.place(2100, 726);
    g.cam.x = 1150;
    return;
  }

  if (scene === 'frozen') {
    W.commitCut(wallRect);
    W.progress.scene2 = true;
    W.time = 30;
    W.commitCut(wheelRect);          // wheel cut while the load is off the sensor
    g.player.place(2900, 726);
    g.cam.x = 2060;
    settle(4);
    return;
  }

  if (scene === 'wall') {
    g.player.place(700, 726);
    g.cam.x = 0;
    return;
  }

  if (scene === 'gap') {
    W.progress.scene1 = true;
    W.commitCut(wallRect);
    g.player.place(1560, 726);
    g.cam.x = 760;
    W.time = 36;
    return;
  }

  if (scene === 'final' || scene === 'won') {
    W.progress.scene1 = true;
    W.progress.scene2 = true;
    W.commitCut(wallRect);
    W.time = 25.38;
    W.commitCut(wheelRect);
    g.game.visual.sensor = 1;
    g.game.visual.shutter = 1;
    g.player.place(3020, 726);
    g.cam.x = 2060;
    if (scene === 'won') {
      g.game.state = 'won';
      g.game.stats = { time: 214, blades: 2, tape: 7.4 };
      g.player.place(3660, 726);
      g.cam.x = 2280;
    }
    return;
  }

  if (scene === 'ride') {
    W.progress.scene1 = true;
    W.commitCut(wallRect);
    g.player.place(1700, 726);
    W.dollyBoard = W.time;
    settle(12);
    g.cam.x = 1360;
    return;
  }

  if (scene === 'pause') {
    g.game.state = 'paused';
    g.player.place(700, 726);
    g.cam.x = 0;
    return;
  }

  if (scene === 'touch') {
    g.input.touchMode = true;
    g.player.place(700, 726);
    g.cam.x = 0;
  }
}

go();
g.draw(performance.now());
document.title = 'ready';
</script>
